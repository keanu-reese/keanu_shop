name: Publish NETOPS Docker image

on:
  push:
    branches:
      - main
    paths:
      - "netopslab-command-center/Dockerfile"
      - "netopslab-command-center/app/**"
      - ".github/workflows/publish-netops.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NETOPS source
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ./netopslab-command-center
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/keanu-reese/netops-command-center:3.1.1
            ghcr.io/keanu-reese/netops-command-center:latest
          labels: |
            org.opencontainers.image.source=https://github.com/keanu-reese/keanu_shop
            org.opencontainers.image.title=NETOPS Command Center
            org.opencontainers.image.description=Self-hosted Umbrel network operations dashboard
